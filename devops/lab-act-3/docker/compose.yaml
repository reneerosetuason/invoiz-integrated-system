name: invoiz-lab-act-3
services:
  app:
    image: invoiz-lab:local
    env_file: ../.runtime/container.env
    ports:
      - '127.0.0.1:8085:80'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app-storage:/var/www/html/storage
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: invoiz_lab_container
      MYSQL_USER: invoiz_lab
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set a disposable DB_PASSWORD in the lab runtime env file}
      MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
    healthcheck:
      test: ['CMD-SHELL', 'MYSQL_PWD="$$MYSQL_PASSWORD" mysqladmin ping -h 127.0.0.1 -u "$$MYSQL_USER" --silent']
      interval: 10s
      timeout: 5s
      retries: 15
    volumes:
      - mysql-data:/var/lib/mysql
volumes:
  app-storage:
  mysql-data:
